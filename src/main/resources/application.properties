spring.application.name=sqa-exp1-s1

server.port=8081
# Ruta base del sitio. La pauta pide http://[IP]/recetas.
# Si el docente indica otra ruta, basta con cambiar este valor.
server.servlet.context-path=/recetas

# Thymeleaf
spring.thymeleaf.cache=false

# Errores: no exponer trazas ni mensajes internos al usuario
server.error.include-stacktrace=never
server.error.include-message=never
server.error.whitelabel.enabled=false

# Cookie de sesion
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.timeout=30m
