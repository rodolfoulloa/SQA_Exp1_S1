<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Iniciar sesión')}"></head>
<body>
<nav th:replace="~{fragments :: navbar}"></nav>

<main class="container">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <h1 class="mb-3">Iniciar sesión</h1>

            <div class="alert alert-danger" th:if="${param.error}" role="alert">
                Usuario o contraseña incorrectos.
            </div>
            <div class="alert alert-success" th:if="${param.logout}" role="status">
                Cerraste sesión correctamente.
            </div>
            <div class="alert alert-success" th:if="${param.registrado}" role="status">
                Cuenta creada. Ya puedes iniciar sesión con tu correo.
            </div>

            <form th:action="@{/login}" method="post">
                <div class="mb-3">
                    <label for="username" class="form-label">Usuario o correo</label>
                    <input type="text" class="form-control" id="username" name="username" required
                           maxlength="100" autofocus autocomplete="username">
                </div>
                <div class="mb-3">
                    <label for="password" class="form-label">Contraseña</label>
                    <input type="password" class="form-control" id="password" name="password" required
                           maxlength="64" autocomplete="current-password">
                </div>
                <button type="submit" class="btn btn-primary">Entrar</button>
            </form>

            <p class="mt-3">¿No tienes cuenta? <a th:href="@{/registro}">Regístrate aquí</a></p>
        </div>
    </div>
</main>

<th:block th:replace="~{fragments :: footer}"></th:block>
</body>
</html>
