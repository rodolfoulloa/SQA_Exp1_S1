<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Registro')}"></head>
<body>
<nav th:replace="~{fragments :: navbar}"></nav>

<main class="container">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <h1 class="mb-3">Crear cuenta</h1>

            <form th:action="@{/registro}" th:object="${registroForm}" method="post" novalidate>
                <div class="mb-3">
                    <label for="nombre" class="form-label">Nombre</label>
                    <input type="text" class="form-control" id="nombre" th:field="*{nombre}" maxlength="60"
                           autocomplete="name" th:errorclass="is-invalid">
                    <div class="invalid-feedback" th:if="${#fields.hasErrors('nombre')}" th:errors="*{nombre}"></div>
                </div>
                <div class="mb-3">
                    <label for="correo" class="form-label">Correo electrónico</label>
                    <input type="email" class="form-control" id="correo" th:field="*{correo}" maxlength="100"
                           autocomplete="email" th:errorclass="is-invalid">
                    <div class="invalid-feedback" th:if="${#fields.hasErrors('correo')}" th:errors="*{correo}"></div>
                </div>
                <div class="mb-3">
                    <label for="password" class="form-label">Contraseña</label>
                    <input type="password" class="form-control" id="password" th:field="*{password}" maxlength="64"
                           autocomplete="new-password" th:errorclass="is-invalid">
                    <div class="form-text">Mínimo 8 caracteres, con letras y números.</div>
                    <div class="invalid-feedback" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></div>
                </div>
                <div class="mb-3">
                    <label for="confirmarPassword" class="form-label">Confirmar contraseña</label>
                    <input type="password" class="form-control" id="confirmarPassword" th:field="*{confirmarPassword}"
                           maxlength="64" autocomplete="new-password" th:errorclass="is-invalid">
                    <div class="invalid-feedback" th:if="${#fields.hasErrors('confirmarPassword')}"
                         th:errors="*{confirmarPassword}"></div>
                </div>
                <button type="submit" class="btn btn-primary">Registrarme</button>
            </form>

            <p class="mt-3">¿Ya tienes cuenta? <a th:href="@{/login}">Inicia sesión</a></p>
        </div>
    </div>
</main>

<th:block th:replace="~{fragments :: footer}"></th:block>
</body>
</html>
